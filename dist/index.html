<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Swarm Gate</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        color: #ffffff;
      }

      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 480px;
        margin: 0 auto;
        overflow: hidden;
        background: #000000;
        touch-action: none;
      }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      #debug-overlay {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        left: calc(env(safe-area-inset-left, 0px) + 8px);
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        line-height: 1.4;
        color: #00ff88;
        pointer-events: auto;
        display: none;
        z-index: 1000;
      }

      #debug-overlay .metric {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      #debug-overlay .label {
        color: #94a3b8;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CT683TWz.js"></script>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="hud-overlay">
        <div id="debug-overlay">
          <div class="metric"><span class="label">FPS:</span><span id="dbg-fps">60</span></div>
          <div class="metric"><span class="label">MS:</span><span id="dbg-ms">16.6</span></div>
          <div class="metric"><span class="label">UNITS:</span><span id="dbg-units">0</span></div>
          <div class="metric"><span class="label">DRAWS:</span><span id="dbg-draws">0</span></div>
          <div class="metric"><span class="label">TRIS:</span><span id="dbg-tris">0</span></div>
          <div class="metric"><span class="label">DPR:</span><span id="dbg-dpr">1.0</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
