<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Swarm Gate</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        color: #ffffff;
      }

      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 480px;
        margin: 0 auto;
        overflow: hidden;
        background: #000000;
        touch-action: none;
      }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }

      #debug-overlay {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        left: calc(env(safe-area-inset-left, 0px) + 8px);
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        padding: 6px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        line-height: 1.4;
        color: #00ff88;
        pointer-events: auto;
        display: none;
        z-index: 1000;
      }

      #debug-overlay .metric {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      #debug-overlay .label {
        color: #94a3b8;
      }

      /* Base HP HUD */
      #base-hp-container {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        right: calc(env(safe-area-inset-right, 0px) + 12px);
        width: 175px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.35);
        border-radius: 12px;
        padding: 6px 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        pointer-events: none;
        z-index: 500;
        transition: border-color 0.2s ease;
      }

      #base-hp-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        color: #94a3b8;
      }

      #base-hp-text {
        font-family: ui-monospace, SFMono-Regular, monospace;
        color: #38bdf8;
      }

      #base-hp-track {
        width: 100%;
        height: 8px;
        background: rgba(30, 41, 59, 0.9);
        border-radius: 9999px;
        overflow: hidden;
      }

      #base-hp-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #10b981 0%, #38bdf8 100%);
        border-radius: 9999px;
        transition: width 0.15s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s ease;
      }

      #base-hp-fill.danger {
        background: linear-gradient(90deg, #ef4444 0%, #f97316 100%);
      }

      /* Damage Flash Vignette */
      #damage-vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(239, 68, 68, 0.55) 100%);
        transition: opacity 0.1s ease-out;
        z-index: 600;
      }

      /* Game Over Modal */
      #game-over-modal {
        position: absolute;
        inset: 0;
        background: rgba(11, 15, 25, 0.88);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
        pointer-events: auto;
        padding: 24px;
      }

      .game-over-card {
        background: #1e293b;
        border: 2px solid #ef4444;
        border-radius: 20px;
        padding: 32px 24px;
        text-align: center;
        max-width: 320px;
        width: 100%;
        box-shadow: 0 16px 36px rgba(239, 68, 68, 0.25);
      }

      .game-over-title {
        color: #ef4444;
        font-size: 26px;
        font-weight: 900;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      .game-over-subtitle {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.4;
        margin-bottom: 28px;
      }

      .restart-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 52px;
        min-width: 180px;
        padding: 14px 28px;
        background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 1px;
        border: none;
        border-radius: 9999px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        touch-action: manipulation;
        transition: transform 0.1s ease, filter 0.15s ease;
      }

      .restart-btn:active {
        transform: scale(0.96);
        filter: brightness(0.9);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
      <div id="damage-vignette"></div>
      <div id="hud-overlay">
        <div id="base-hp-container">
          <div id="base-hp-header">
            <span class="base-hp-title">BASE DEFENSE</span>
            <span id="base-hp-text">100 / 100</span>
          </div>
          <div id="base-hp-track">
            <div id="base-hp-fill"></div>
          </div>
        </div>
        <div id="debug-overlay">
          <div class="metric"><span class="label">FPS:</span><span id="dbg-fps">60</span></div>
          <div class="metric"><span class="label">MS:</span><span id="dbg-ms">16.6</span></div>
          <div class="metric"><span class="label">UNITS:</span><span id="dbg-units">0</span></div>
          <div class="metric"><span class="label">BLUE:</span><span id="dbg-blue">0</span></div>
          <div class="metric"><span class="label">RED:</span><span id="dbg-red">0</span></div>
          <div class="metric"><span class="label">BASE HP:</span><span id="dbg-base-hp">100</span></div>
          <div class="metric"><span class="label">DRAWS:</span><span id="dbg-draws">0</span></div>
          <div class="metric"><span class="label">TRIS:</span><span id="dbg-tris">0</span></div>
          <div class="metric"><span class="label">DPR:</span><span id="dbg-dpr">1.0</span></div>
          <div class="metric"><span class="label">Z-RNG:</span><span id="dbg-zrange">0 - 0</span></div>
        </div>
      </div>
      <div id="game-over-modal">
        <div class="game-over-card">
          <h1 class="game-over-title">BASE DESTROYED</h1>
          <p class="game-over-subtitle">The horde reached your defense line.</p>
          <button id="btn-restart" class="restart-btn" type="button">RESTART MISSION</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
